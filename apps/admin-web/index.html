<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO Phase 7: replace 'unsafe-inline' with nonce/hash for the bootstrap script -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';"
    />
    <title>SportZal</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('sportzal:ui:v1');
          var theme = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && typeof parsed.state.theme === 'string') {
              theme = parsed.state.theme;
            }
          }
          var resolved =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light';
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
