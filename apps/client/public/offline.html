<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Нет связи — Мой зал</title>
<meta name="theme-color" content="#2dd4a4">
<style>
  :root {
    --accent: #2dd4a4;
    --accent-deep: #0f9b76;
    --accent-soft: #d6f5ea;
    --bg: #f5f5f4;
    --surface: #ffffff;
    --border: #e7e5e4;
    --border-strong: #d6d3d1;
    --text: #1c1917;
    --text-2: #57534e;
    --text-3: #a8a29e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1511;
      --surface: #221d17;
      --border: #3a3128;
      --border-strong: #4a4035;
      --text: #f4ebde;
      --text-2: #c2b39d;
      --text-3: #8a7c69;
      --accent-soft: rgba(45, 212, 164, 0.18);
    }
    html { background: #0e0a07; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100svh;
    display: flex; flex-direction: column;
  }
  .wrap {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 28px;
    text-align: center;
  }
  .icon {
    width: 88px; height: 88px; border-radius: 22px;
    background: var(--accent-soft); color: var(--accent-deep);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.6px;
    margin: 0 0 12px; line-height: 1.15;
  }
  p {
    font-size: 16px; color: var(--text-2);
    line-height: 1.5; margin: 0 0 8px;
    max-width: 320px;
  }
  .qr-card {
    margin-top: 36px; padding: 22px;
    background: var(--surface); border-radius: 22px;
    border: 0.5px solid var(--border);
    box-shadow: 0 8px 30px rgba(28,25,23,0.08);
    max-width: 320px;
  }
  .qr-title {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.6px; color: var(--text-3); margin-bottom: 14px;
  }
  .qr-box {
    width: 200px; height: 200px;
    background: #fff;
    border-radius: 14px; padding: 14px;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    position: relative;
  }
  .qr-svg { display: block; width: 100%; height: 100%; }
  .qr-stale {
    display: inline-block; margin-top: 14px;
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    border-radius: 999px; background: var(--accent-soft);
    color: var(--accent-deep);
  }
  .actions {
    margin-top: 28px; display: flex; flex-direction: column;
    gap: 10px; width: 100%; max-width: 320px;
  }
  .btn {
    appearance: none; border: 0;
    height: 50px; padding: 0 22px;
    border-radius: 999px;
    font-size: 16px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--text); color: var(--bg); }
  .btn-ghost {
    background: transparent; color: var(--text-2);
    border: 0.5px solid var(--border-strong);
  }
  .footer {
    padding: 16px 24px 26px;
    font-size: 12px; color: var(--text-3);
    text-align: center; line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
        <path d="M5 12.5a10 10 0 0114 0M8 16a6 6 0 018 0M11 19.5a1.5 1.5 0 012 0M3 3l18 18"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <h1>Нет связи</h1>
    <p>Похоже, интернет пропал. Покажи администратору QR ниже — он сохранён локально и работает оффлайн.</p>

    <div class="qr-card">
      <div class="qr-title">Пропуск · оффлайн</div>
      <div class="qr-box" id="qrbox">
        <!-- QR pattern injected below -->
      </div>
      <div class="qr-stale">Кэш: сегодня, 9:41 · действителен 24 ч</div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="location.reload()">Попробовать снова</button>
      <button class="btn btn-ghost" onclick="history.back()">Назад</button>
    </div>
  </div>

  <div class="footer">
    Мой зал · оффлайн-режим<br>
    QR обновится при следующем подключении
  </div>

  <script>
    // Generate a quiet QR pattern inline so we don't depend on any other file
    (function () {
      const N = 25, S = 172;
      const cell = S / N;
      const seed = 7;
      const rng = (i, j) => {
        const v = Math.sin((i * 73 + j * 131 + seed * 17)) * 10000;
        return v - Math.floor(v);
      };
      const isFinder = (i, j) => (
        (i < 7 && j < 7) || (i < 7 && j >= N - 7) || (i >= N - 7 && j < 7)
      );
      const parts = [];
      const drawFinder = (cx, cy) => {
        const x = cx * cell, y = cy * cell;
        return `
          <rect x="${x}" y="${y}" width="${7*cell}" height="${7*cell}" rx="${cell*0.7}" fill="#0a0a0a"/>
          <rect x="${x+cell}" y="${y+cell}" width="${5*cell}" height="${5*cell}" rx="${cell*0.5}" fill="#fff"/>
          <rect x="${x+2*cell}" y="${y+2*cell}" width="${3*cell}" height="${3*cell}" rx="${cell*0.3}" fill="#0a0a0a"/>
        `;
      };
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if (isFinder(i, j)) continue;
          if (rng(i, j) > 0.55) {
            parts.push(`<rect x="${j*cell}" y="${i*cell}" width="${cell}" height="${cell}" rx="${cell*0.25}" fill="#0a0a0a"/>`);
          }
        }
      }
      parts.push(drawFinder(0, 0));
      parts.push(drawFinder(0, N - 7));
      parts.push(drawFinder(N - 7, 0));
      document.getElementById('qrbox').innerHTML =
        `<svg class="qr-svg" viewBox="0 0 ${S} ${S}" xmlns="http://www.w3.org/2000/svg">${parts.join('')}</svg>`;
    })();

    // Auto-retry when connection comes back
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
