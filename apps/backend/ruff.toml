target-version = "py312"
line-length = 100

[lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort (import ordering)
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "DTZ",   # flake8-datetimez (datetime hygiene — Europe/Moscow project pin)
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "RUF",   # ruff-native rules
]
ignore = [
    "S101",  # allow assert (used by pytest, lands in Phase 3)
]

# External rule-code prefixes — ruff treats `# noqa: SVC001 …` as valid even
# though SVC is not a native ruff rule. Phase 15 INFRA-13 introduces the
# `SVC001 caller-owns-txn` opt-out marker consumed by the AST commit-gate at
# `tests/unit/test_service_commit_gate.py`. The marker MUST appear on the def
# line of private (`_`-prefixed) service helpers whose caller (e.g. an ARQ
# worker) owns the transaction (Phase 18 D-01). Registering the prefix here
# prevents RUF102 ("Invalid rule code in `# noqa`") at every callsite.
external = ["SVC"]

[lint.per-file-ignores]
# alembic env.py uses untyped Alembic API; skip security + import-order
"alembic/env.py" = ["S", "I001"]
# tests/conftest.py carries a locked `# noqa: BLE001` comment per Phase 3 plan 01 D-10
# (rationale-bearing). BLE rule is not in `select`, so the noqa would otherwise be
# flagged as redundant (RUF100). Plan locks the literal except form — preserve it.
"tests/conftest.py" = ["RUF100"]
# Phase 27 NTF-COPY-01 (plan 27-03): the locked Russian DM templates each carry a
# disciplinary `# noqa: RUF001` tripwire so that a future edit which introduces an
# ambiguous Cyrillic letter is silently allowed (vs. needing a re-review). The
# specific shipped strings happen to mix unambiguous Cyrillic with the Latin
# `{end_date}` placeholder, and ruff does not currently flag them under RUF001 --
# so without this allowance every line would trip RUF100 ("unused noqa").
"app/integrations/telegram/copy.py" = ["RUF100"]
# Phase 42 AUTH-EM-03 (plan 42-05): the locked Russian EMAIL_OTP_LOGIN template
# (D-42-23) carries a disciplinary `# noqa: RUF001` tripwire on the dict-entry
# line so that a future edit which introduces an ambiguous Cyrillic letter is
# flagged for re-review. The currently-shipped Russian copy uses unambiguous
# Cyrillic only, so the noqa is "unused" today and would otherwise trip RUF100.
"app/modules/auth/email_templates.py" = ["RUF100"]
# Phase 45 NOTIFY-12 (plan 45-06): the locked Russian payment-receipt templates
# (D-45-15) carry disciplinary `# noqa: RUF001` tripwires on every Cyrillic line
# so a future edit introducing an ambiguous Cyrillic letter is flagged for
# re-review. The currently-shipped Russian copy uses unambiguous Cyrillic only,
# so the noqa directives are "unused" today and would otherwise trip RUF100.
"app/modules/payments/email_templates.py" = ["RUF100"]
# 260529-olc RUN-03-F1: the 4 locked Russian online-payment email templates
# carry disciplinary `# noqa: RUF001` tripwires on every Cyrillic line (mirrors
# payments/email_templates.py precedent — any future edit introducing an
# ambiguous Cyrillic letter is flagged for re-review). Currently-shipped copy
# uses unambiguous Cyrillic only, so the noqa directives are "unused" today.
"app/modules/online_payments/email_templates.py" = ["RUF100"]
# 260529-olc RUN-03-F1: the render-assertion tests carry disciplinary
# `# noqa: RUF001` tripwires on locked Russian phrasing literals mirroring the
# template-module precedent (test_actor_display_format.py, line 62 above).
"tests/unit/integrations/email/test_dispatcher.py" = ["RUF100"]
# Phase 45 NOTIFY-12 (plan 45-02): same disciplinary `# noqa: RUF001` tripwire
# on the Cyrillic defensive fallback "Сотрудник" in format_actor_display (and
# the parametrize cases that exercise it). Today's literals are unambiguous
# Cyrillic so the noqa would otherwise trip RUF100.
"app/modules/users/display.py" = ["RUF100"]
"tests/unit/test_actor_display_format.py" = ["RUF100"]
# Phase 45 NOTIFY-12 (plan 45-02): Cyrillic genitive month names + NBSP
# constants + Russian "г." abbreviation (RUF002/RUF003 for docstring/comment;
# RUF001 for the NBSP literal `_NBSP = " "`). Same allowance shape as
# memberships email templates (line 77 below) because this file IS the canonical
# source the receipt email render path imports for amount + datetime formatting.
"app/core/formatters.py" = ["RUF001", "RUF002", "RUF003", "RUF100"]
"tests/unit/test_formatters.py" = ["RUF001", "RUF002", "RUF003", "RUF100"]
# Phase 45 NOTIFY-08 (plan 45-04): the locked Russian expiring-membership email
# templates (D-45-15) carry disciplinary `# noqa: RUF001` tripwires (mirrors
# auth precedent line 50). Unlike auth, these templates legitimately MUST
# contain the Russian abbreviation `г.` (the letter `г` is RUF001-ambiguous
# with Latin `r`) and literal U+00A0 NO-BREAK SPACE between the rendered
# date and `г.` (D-45-17 NBSP discipline). RUF002 catches the same `г` in
# the module docstring. Locked copy + per-domain ownership (D-45-15) means
# these characters cannot move, so RUF001/RUF002 are silenced for this file;
# RUF100 covers the now-no-op per-line noqa tripwire markers.
"app/modules/memberships/email_templates.py" = ["RUF001", "RUF002", "RUF100"]
# Phase 45 NOTIFY-07 (plan 45-07): memberships/notifications.py hoists the
# Russian genitive month-name table from telegram/copy.py for cross-channel
# reuse (D-45-16). Cyrillic-only literals trip RUF001 (letter-ambiguity
# tripwires); the module docstring + helper docstring also reference the
# `г.` abbreviation (RUF002 for docstrings). Locked copy means these
# characters cannot move, so silence RUF001/RUF002 for this file and
# RUF100 for the per-line noqa tripwires that ruff treats as no-ops today.
"app/modules/memberships/notifications.py" = ["RUF001", "RUF002", "RUF003", "RUF100"]
# Phase 60 RPT-04 (plan 60-04): trainer-usage integration tests use Cyrillic
# trainer names (RUF001/RUF002/RUF003 — ambiguous Cyrillic letters in Russian
# proper nouns used as test seed data; intentional test fixture design) and
# blocking subprocess.run for PITFALL 10 / lint-imports ship-gate assertions
# (ASYNC221: blocking call in async test; S603/S607: subprocess with list argv
# from trusted test constants — acceptable security trade-off in test context).
"tests/integration/reports/test_reports_trainers.py" = [
    "RUF001", "RUF002", "RUF003",
    "ASYNC221", "S603", "S607",
]

# Phase 117 Plan 02: pytest re-export pattern — fixture names in function parameters
# shadow module-level imports that are there solely for pytest fixture discovery.
# This is the canonical conftest re-export pattern; F811 is a false positive here.
"tests/messaging/test_threads_capture.py" = ["F811"]
# Pre-existing: test_staff_messaging.py has the same re-export pattern + E402 module
# import not at top of file (re-export from memberships conftest placed after helpers).
"tests/integration/messaging/test_staff_messaging.py" = ["F811", "E402"]

[format]
quote-style = "double"
indent-style = "space"
