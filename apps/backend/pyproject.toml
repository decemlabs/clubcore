[project]
name = "sportzal-backend"
version = "0.1.0"
description = "Sportzal — gym CRM backend (modular monolith)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=13.0,<14",
    "alembic>=1.13",
    "argon2-cffi>=25.1.0,<26",
    "arq>=0.26",
    "asyncpg>=0.30",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1.4,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.0",
    "pyjwt>=2.12.1,<3",
    "python-telegram-bot>=22.7,<23",
    "redis>=5,<6",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
    "fakeredis>=2.35.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.env"
disable_error_code = ["no-untyped-call"]

# Phase 30 INFRA-22: payments append-only AST fixtures contain intentionally
# bogus call signatures and untyped params to exercise the walker. They are
# parsed as text (ast.parse), never imported at runtime.
[[tool.mypy.overrides]]
module = "tests.unit.fixtures.*"
ignore_errors = true

# Phase 42 42-07: aioboto3 + botocore lack py.typed markers. Suppressing the
# import-untyped error here keeps mypy --strict for our own EmailClient code
# without forcing the heavy boto3-stubs dependency into the dev install.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Fixtures intentionally have unused imports / untyped params for walker testing.
"tests/unit/fixtures/payments_violation_*.py" = ["F401", "F841", "ANN", "ARG001"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
]
