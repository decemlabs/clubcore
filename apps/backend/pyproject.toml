[project]
name = "sportzal-backend"
version = "0.1.0"
description = "Sportzal — gym CRM backend (modular monolith)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aioboto3>=13.0,<14",
    "filetype>=1.2,<2",
    "alembic>=1.13",
    "argon2-cffi>=25.1.0,<26",
    "arq>=0.26",
    "asyncpg>=0.30",
    "email-validator>=2.0",
    "fastapi>=0.115",
    # CVE-2026-48710 "BadHost" — HIGH host-header auth-bypass, fixed in starlette 1.0.1.
    # FastAPI only floors starlette>=0.46.0, so pin the security minimum explicitly.
    "starlette>=1.0.1",
    "httpx>=0.27",
    "jinja2>=3.1.4,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.0",
    "pyjwt>=2.12.1,<3",
    "python-telegram-bot>=22.7,<23",
    "redis>=5,<6",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # v8+ required: 7.1.0 caps starlette<1.0.0, blocking the CVE-2026-48710 fix.
    "prometheus-fastapi-instrumentator>=8,<9",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "asgi-lifespan>=2.1",
    "fakeredis>=2.35.1",
    "respx>=0.21",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.env"
disable_error_code = ["no-untyped-call"]

# Phase 30 INFRA-22: payments append-only AST fixtures contain intentionally
# bogus call signatures and untyped params to exercise the walker. They are
# parsed as text (ast.parse), never imported at runtime.
[[tool.mypy.overrides]]
module = "tests.unit.fixtures.*"
ignore_errors = true

# Phase 42 42-07: aioboto3 + botocore lack py.typed markers. Suppressing the
# import-untyped error here keeps mypy --strict for our own EmailClient code
# without forcing the heavy boto3-stubs dependency into the dev install.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "filetype.*"]
ignore_missing_imports = true

# Phase 63 DEBT-03 / D-63-03: scope `mypy --strict` to app/ only. Test suite
# carries pre-existing untyped fixtures + dynamic helpers that would require
# a separate cleanup pass; CI gate stays exactly `uv run mypy --strict app`,
# so this override prevents an out-of-band `mypy app tests` ad-hoc run from
# crashing while keeping app/ strict-clean (zero deferral tracker file needed).
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.ruff.lint.per-file-ignores]
# Fixtures intentionally have unused imports / untyped params for walker testing.
"tests/unit/fixtures/payments_violation_*.py" = ["F401", "F841", "ANN", "ARG001"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
# Safety net: any test that blocks for >180s (e.g. a future lock-vs-subprocess
# contention like the working_hours_config self-deadlock) is auto-failed instead
# of hanging the whole run forever. See debug session pytest-isolation-deadlock.
# `signal` (SIGALRM on the main thread) FAILS ONLY THE OFFENDING TEST and lets the
# run continue to completion — unlike `thread`, which calls os._exit() and aborts
# the whole session. Tests here run on the main thread (pytest-asyncio runner), so
# SIGALRM interrupts even a blocked syscall (DB lock wait, network read).
timeout = 180
timeout_method = "signal"
markers = [
    # Tests that spawn `alembic downgrade` in a subprocess must NOT hold the
    # autouse permissive_booking_config UPDATE row lock on working_hours_config,
    # or the downgrade's DELETE/DROP deadlocks against it. This marker makes the
    # autouse fixture early-return for such tests. See pytest-isolation-deadlock.
    "no_permissive_booking_config: skip the autouse permissive_booking_config fixture (alembic-downgrade subprocess tests)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    # botocore uses datetime.utcnow() which is deprecated in Python 3.12; this is
    # an upstream issue in botocore/aiobotocore — not actionable in this codebase.
    # Suppressed so the deprecation warning does not break app lifespan setup in tests
    # (Phase 92 Plan 02 added S3/aioboto3 to the lifespan; botocore fires this warning
    # during SigV4 signing when the lifespan runs ensure_bucket()).
    "ignore::DeprecationWarning:botocore.*",
    # Suppress BaseEventLoop.__del__ ResourceWarning that appears when pytest-asyncio
    # auto mode tests and sync Starlette TestClient WS tests share a session.
    # The WS TestClient fixture uses asyncio.run() for the DB connectivity probe
    # (runs before the anyio portal opens), which creates a loop that Python
    # garbage-collects with __del__ when pytest-asyncio also owns an event loop.
    # This is a test-isolation limitation of mixing sync WS tests with async tests;
    # the production WS code is unaffected (Phase 90 RT-01/03 plan 03).
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # starlette 1.x (bumped to 1.3.1, commit 1352ef74) emits StarletteDeprecationWarning
    # at IMPORT time of `starlette.testclient`/`fastapi.testclient` when the optional
    # `httpx2` package is absent ("Using `httpx` with `starlette.testclient` is
    # deprecated; install `httpx2` instead"). With filterwarnings=error this aborts
    # COLLECTION of every module importing the sync TestClient (tests/messaging WS
    # tests + tests/unit/test_webhook_router_smoke.py), interrupting the whole run.
    # We intentionally keep the sync TestClient (WS tests need it) and are not adopting
    # httpx2 here, so suppress this specific deprecation. Mirrors the botocore idiom above.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
