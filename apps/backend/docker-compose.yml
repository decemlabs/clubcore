# Phase 3 INFRA-02 — local dev stack.
# Per CONTEXT D-04 (hot-reload via override) and D-12 (one-shot migrate service,
# postgres healthcheck, named volume).
services:
  backend:
    build: .
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/clubcore
      REDIS_URL: redis://redis:6379/0
      # Phase 92 ATT-01 — point backend at the in-network SeaweedFS S3 service.
      # Bucket auto-create runs at app startup (ensure_bucket() in Plan 02 lifespan).
      S3_ENDPOINT_URL: http://s3:8333
      S3_BUCKET: clubcore-local
      S3_ACCESS_KEY_ID: dev-access-key
      S3_SECRET_ACCESS_KEY: dev-secret-key
      S3_REGION: ru-central1
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      s3:
        condition: service_healthy

  # Phase 92 ATT-01 — S3-compatible local dev object storage.
  # SeaweedFS weed server in S3 API mode; dev-default credentials.
  # The S3 port is 8333; HTTP API for weed's internal management is 9333.
  # Bucket auto-created at app startup by ensure_bucket() (Plan 02 lifespan);
  # this service provides the endpoint only (no pre-created bucket needed).
  s3:
    image: chrislusf/seaweedfs:3.84
    command: >
      server -s3 -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=128
      -ip.bind=0.0.0.0
    environment:
      # IAM is off by default in SeaweedFS; dev creds are passed via s3.json.
      WEED_S3_ACCESS_KEY: dev-access-key
      WEED_S3_SECRET_KEY: dev-secret-key
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"
    healthcheck:
      # SeaweedFS S3 answers anonymous GET / with 403 Forbidden — a live server.
      # BusyBox wget prints "server returned error: HTTP/1.1 403 Forbidden" to
      # stderr (even with -q); a dead server prints "can't connect". Grepping for
      # Forbidden distinguishes the two reliably. (No /status path on S3; service
      # binds eth0 unless -ip.bind=0.0.0.0, both fixed here.)
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ 2>&1 | grep -q Forbidden"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  telegram-bot:
    build: .
    command: python -m app.workers.telegram_bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/clubcore
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  arq-worker:
    build: .
    command: arq app.workers.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/clubcore
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/clubcore
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: clubcore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d clubcore"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # Local full-stack frontends (nginx static build + /api reverse-proxy).
  # Production images use infra/nginx/{admin,client}.conf (no /api upstream —
  # the k8s ingress routes /api). Locally there is no ingress, so we mount the
  # *.local.conf override that proxies /api → backend. Build context is the repo
  # root (the Dockerfiles COPY pnpm-lock.yaml + workspace packages).
  admin:
    build:
      context: ../..
      dockerfile: infra/docker/admin.Dockerfile
    volumes:
      - ../../infra/nginx/admin.local.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ../..
      dockerfile: infra/docker/client.Dockerfile
    volumes:
      - ../../infra/nginx/client.local.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5174:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  seaweedfs-data:
