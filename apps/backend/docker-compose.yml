# Phase 3 INFRA-02 — local dev stack.
# Per CONTEXT D-04 (hot-reload via override) and D-12 (one-shot migrate service,
# postgres healthcheck, named volume).
services:
  backend:
    build: .
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/sportzal
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  telegram-bot:
    build: .
    command: python -m app.workers.telegram_bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/sportzal
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  arq-worker:
    build: .
    command: arq app.workers.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/sportzal
      REDIS_URL: redis://redis:6379/0
      TZ: UTC
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/sportzal
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: sportzal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sportzal"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
