{{/*
Postgres app-user Secret — T-118-07

Type: kubernetes.io/basic-auth (CNPG expects this type for bootstrap.initdb.secret)
Name: clubcore-postgres-app (referenced in postgres-cluster.yaml bootstrap.initdb.secret.name)

WARNING: THIS IS A LOCAL K3D DEVELOPMENT SECRET ONLY.
  - The password stored here is PLAINTEXT and is ONLY suitable for local k3d dev.
  - Phase 119 SEC-01 replaces this template with a SealedSecret encrypted with
    the sealed-secrets controller RSA key.
  - NEVER use this plaintext value on a live/production server.
  - NEVER commit a production password to values.yaml or any git-tracked file.

CNPG Basic-Auth Secret format:
  username: the Postgres role name (must match bootstrap.initdb.owner)
  password: the password for the role

The backend DATABASE_URL is constructed in plan 03 ConfigMap/Secret using these credentials:
  postgresql+asyncpg://app:<password>@<release>-postgres-rw:5432/clubcore
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.appSecretName | default "clubcore-postgres-app" }}
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
  annotations:
    # T-118-07: Phase 119 SEC-01 replaces this with a SealedSecret.
    # This plaintext Secret is for local k3d development ONLY.
    clubcore.io/replace-with-sealed-secret: "phase-119-sec-01"
# kubernetes.io/basic-auth type is required by CNPG for bootstrap.initdb.secret
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.owner | default "app" | quote }}
  # WARNING: PLAINTEXT — LOCAL K3D DEV ONLY. Phase 119 SEC-01 replaces with SealedSecret.
  password: {{ .Values.postgres.password | required "postgres.password is required — set via --set or values override" | quote }}
