{{/*
client-pwa-deployment.yaml — Deployment clubcore-client-pwa (NET-04 / IMG-03 gap close)

Closes the Phase-118 gap: IMG-03 built the client-pwa nginx image but never created
the k8s Deployment or Service.  NET-04 requires the static PWA frontend to be served
in-cluster on port 8080 so the Traefik Ingress has a valid backend target.

Architecture:
  - Static nginx workload — no database, no initContainer, no Secret envFrom.
  - Port 8080: nginx:1.27-alpine listens on 8080 per infra/nginx/client-pwa.conf
    (listen 8080, SPA try_files, sw.js no-cache, /api no-store).
  - replicas: 1 (D-V40-REPLICAS: single bare-metal node, v4.0 constraint).
  - runAsUser: 101 — the numeric UID of the `nginx` user in nginx:1.27-alpine.
  - NET-04 SPA/SW behavior: client-pwa.conf already emits:
      sw.js:       Cache-Control: no-cache (SW updates propagate immediately)
      /api/*:      Cache-Control: no-store  (defence-in-depth, T-118-05)
      hashed assets: immutable cache
      index.html:  no-cache, no-store, must-revalidate
    These rules are inherited through the ingress — verified at checkpoint.
  - SEC-03 readOnlyRootFilesystem hardening is Phase 119 plan 02 scope.

Image: clientPwa.image.repository (default clubcore/client-pwa) + .Values.image.tag
       The frontend images share the same git-SHA tag as the backend image
       (see infra/scripts/build-images.sh — all images built from same commit).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clubcore.fullname" . }}-client-pwa
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: client-pwa
spec:
  # D-V40-REPLICAS: single bare-metal node, v4.0 constraint.
  replicas: {{ .Values.clientPwa.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "clubcore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: client-pwa
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "clubcore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: client-pwa
    spec:
      # runAsUser: 101 — numeric UID of the `nginx` user in nginx:1.27-alpine.
      # The client-pwa Dockerfile sets USER nginx (non-root, T-118-04).
      # runAsUser: 1000 is the backend app-user — nginx images use 101.
      # SEC-03 full hardening (readOnlyRootFilesystem, drop ALL) is plan 02 scope.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101

      containers:
        - name: client-pwa
          image: {{ printf "%s:%s" .Values.clientPwa.image.repository (.Values.image.tag | required "image.tag is required — pass --set image.tag=<git-short-sha>") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}

          # nginx runs via image CMD ["nginx", "-g", "daemon off;"] — no override needed.

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Static PWA frontend: no envFrom (no app Secret, no ConfigMap env needed).
          # /api/* proxying is wired at the Traefik Ingress level (NET-01), not here.

          # client-pwa.conf defines location = /healthz returning 200 "ok".
          # Use /healthz for probes (explicit health endpoint; avoids index.html regen).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5

          securityContext:
            runAsNonRoot: true
            runAsUser: 101

          # Resource requests + limits — small static nginx workload.
          resources:
            requests:
              cpu: {{ .Values.clientPwa.resources.requests.cpu | default "25m" | quote }}
              memory: {{ .Values.clientPwa.resources.requests.memory | default "32Mi" | quote }}
            limits:
              cpu: {{ .Values.clientPwa.resources.limits.cpu | default "200m" | quote }}
              memory: {{ .Values.clientPwa.resources.limits.memory | default "128Mi" | quote }}
