{{/*
backup-seaweedfs-cronjob.yaml — Daily SeaweedFS mirror → second PVC CronJob (BAK-02)

BAK-02: daily mirror of the SeaweedFS S3 bucket to a second PVC (local DR copy).

Schedule: "0 4 * * *" = daily 04:00 UTC (after Redis backup at 03:00, after CNPG at 02:00)

Strategy (WR-04): use `aws s3 sync --delete` into a SINGLE stable mirror dir
(/mnt/backup/current/) so the sync is genuinely INCREMENTAL — only changed/new
objects transfer and deletions propagate. After the sync, snapshot the current
state into a dated dir via hardlinks (`cp -al /mnt/backup/current /mnt/backup/YYYY-MM-DD`),
which costs ~0 extra space for unchanged files (shared inodes). This is a local
PVC-backed defense-in-depth copy (in addition to CNPG barmanObjectStore).

  The PREVIOUS approach synced into a fresh empty dated dir every day, so `--delete`
  was a no-op and EVERY run re-downloaded the entire bucket — up to retentionDays full
  copies on a PVC sized for ONE copy, guaranteeing PVC overflow once the bucket grew.

Retention (WR-04): prune dated snapshot dirs older than RETENTION_DAYS (default 28 = 4
  weeks). Because dated dirs are hardlink snapshots of current/, pruning old dirs frees
  only the inodes unique to them; the live mirror in current/ is never pruned.

Second PVC: mirrorPvc — a separate PersistentVolumeClaim on the clubcore-retain StorageClass.
  Size: 20Gi — holds ONE live copy (current/) + hardlink snapshots (≈churn, not N full
  copies). Must be >= total S3 data size + headroom for inter-snapshot churn.
  The PVC is declared as a VolumeClaimTemplate would be, but since this is a CronJob
  (not a StatefulSet), the PVC is pre-declared and referenced by name. The PVC name
  is {{ include "clubcore.fullname" . }}-seaweedfs-mirror-backup.

S3 credentials: reuse the EXISTING clubcore-app-secret keys (T-120-BAK1 — NEVER mint new creds).
  Keys: S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.

Security: SEC-03 pod hardening copied verbatim from migrate-job.yaml:
  Pod:       runAsNonRoot + runAsUser:1000 + seccompProfile:RuntimeDefault
  Container: allowPrivilegeEscalation:false + readOnlyRootFilesystem:true + drop ALL caps
  emptyDir:  /tmp — aws CLI + sync tools may write temp files
  TZ=UTC:    P9 invariant

PVC runAsUser 1000 write access: the PVC is mounted at /mnt/backup with the standard uid 1000.
The initContainer's chown pass is NOT needed here because the PVC is pre-provisioned empty
and the runAsUser=1000 container can write directly. If the cluster's storage driver creates
directories owned by root, an operator may need to run a one-time chown initContainer.
*/}}
{{- if .Values.backup.enabled }}
---
# PersistentVolumeClaim: second PVC for SeaweedFS mirror backup (BAK-02)
# Pre-declared so the CronJob can reference it by name across runs.
# clubcore-retain StorageClass: reclaimPolicy:Retain prevents accidental PVC deletion.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "clubcore.fullname" . }}-seaweedfs-mirror-backup
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-seaweedfs-mirror
  annotations:
    clubcore.io/requirement: "BAK-02"
    # DATA-04 / P1: Retain reclaimPolicy prevents data loss on chart uninstall.
    # To reclaim storage, manually delete PVC + PV after confirming data is no longer needed.
    clubcore.io/data-policy: "retain"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.backup.seaweedfs.mirrorPvc.storageClass | default (include "clubcore.storageClassName" .) | quote }}
  resources:
    requests:
      storage: {{ .Values.backup.seaweedfs.mirrorPvc.size | default "20Gi" | quote }}
---
# CronJob: daily SeaweedFS S3 mirror to second PVC (BAK-02)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "clubcore.fullname" . }}-backup-seaweedfs
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup-seaweedfs
  annotations:
    clubcore.io/requirement: "BAK-02"
    # OBS-05 linkage: Job failure surfaces as kube_job_status_failed metric.
    clubcore.io/alert-linkage: "RestoreVerifyJobFailed (alertmanager-rules.yaml)"
spec:
  # Daily schedule: 04:00 UTC (after Redis backup at 03:00)
  schedule: {{ .Values.backup.seaweedfs.schedule | default "0 4 * * *" | quote }}

  # Prevent concurrent mirror jobs
  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  jobTemplate:
    spec:
      # P4 invariant: no silent retry
      backoffLimit: 0
      # Hard timeout: 60 min for full S3 sync (larger data set than Redis RDB)
      activeDeadlineSeconds: 3600

      template:
        metadata:
          labels:
            {{- include "clubcore.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup-seaweedfs
        spec:
          # SEC-03 / P4: never restart
          restartPolicy: Never

          # SEC-03 pod-level securityContext (migrate-job.yaml verbatim copy)
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault

          volumes:
            # /tmp emptyDir — aws CLI writes temp files (readOnlyRootFilesystem: true)
            - name: tmp
              emptyDir: {}
            # Second PVC: SeaweedFS mirror backup destination
            - name: seaweedfs-mirror-backup
              persistentVolumeClaim:
                claimName: {{ include "clubcore.fullname" . }}-seaweedfs-mirror-backup

          containers:
            - name: seaweedfs-mirror
              # CR-02: purpose-built backup image with aws-cli + coreutils PRE-BAKED.
              # Runtime `apk add aws-cli` cannot work under the SEC-03
              # readOnlyRootFilesystem: true, so the CLI ships in the image instead.
              image: {{ include "clubcore.backupImage" . | quote }}
              imagePullPolicy: IfNotPresent

              # SEC-03 container-level hardening (copied verbatim from migrate-job.yaml)
              securityContext:
                {{- include "clubcore.hardenedSecurityContext" (dict "runAsUser" 1000) | nindent 16 }}

              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                # Mirror backup destination: daily dated subdir written here
                - name: seaweedfs-mirror-backup
                  mountPath: /mnt/backup

              env:
                # P9 TZ invariant
                - name: TZ
                  value: "UTC"
                # SeaweedFS in-cluster S3 endpoint
                - name: S3_ENDPOINT_URL
                  value: {{ .Values.backup.postgres.s3EndpointUrl | default (printf "http://%s-seaweedfs-s3:8333" .Release.Name) | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.config.s3Bucket | default "clubcore" | quote }}
                # WR-04: single age-based retention window for dated hardlink snapshots.
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.seaweedfs.retentionDays | default 28 | quote }}
                # S3 credentials — reuse EXISTING app-secret (T-120-BAK1: NEVER mint new creds)
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "clubcore.fullname" . }}-app-secret
                      key: S3_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "clubcore.fullname" . }}-app-secret
                      key: S3_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  value: {{ .Values.config.s3Region | default "ru-central1" | quote }}

              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  # ── Prerequisites ────────────────────────────────────────────
                  # CR-02: aws-cli is PRE-BAKED in clubcore/backup — no runtime
                  # `apk add` (impossible under readOnlyRootFilesystem: true).
                  command -v aws >/dev/null 2>&1 || { echo "[backup-seaweedfs] ERROR: aws-cli missing from image" >&2; exit 1; }

                  DATESTAMP=$(date -u +"%Y-%m-%d")
                  CURRENT_DIR="/mnt/backup/current"
                  SNAPSHOT_DIR="/mnt/backup/${DATESTAMP}"
                  echo "[backup-seaweedfs] Starting SeaweedFS mirror at ${DATESTAMP} UTC"

                  # ── Step 1: Incremental sync into the stable current/ dir ─────
                  # WR-04: sync into a SINGLE persistent dir so `--delete` is a real
                  # incremental mirror (only changed objects transfer; deletions
                  # propagate). NEVER sync into a fresh dated dir (that forces a full
                  # re-download every run and overflows the PVC).
                  echo "[1/3] Incremental sync s3://${S3_BUCKET}/ -> ${CURRENT_DIR}/ ..."
                  mkdir -p "${CURRENT_DIR}"
                  aws s3 sync \
                    "s3://${S3_BUCKET}/" \
                    "${CURRENT_DIR}/" \
                    --endpoint-url "${S3_ENDPOINT_URL}" \
                    --no-progress \
                    --delete
                  OBJECT_COUNT=$(find "${CURRENT_DIR}" -type f | wc -l)
                  echo "[1/3] Sync complete: ${OBJECT_COUNT} objects in ${CURRENT_DIR}"

                  # ── Step 2: Hardlink snapshot of current/ into a dated dir ────
                  # WR-04: `cp -al` creates a point-in-time snapshot that SHARES inodes
                  # with current/ for unchanged files — ~0 extra space per snapshot.
                  echo "[2/3] Snapshotting ${CURRENT_DIR} -> ${SNAPSHOT_DIR} (hardlinks)..."
                  rm -rf "${SNAPSHOT_DIR}"
                  cp -al "${CURRENT_DIR}" "${SNAPSHOT_DIR}"

                  # ── Step 3: Retention pruning ─────────────────────────────────
                  # WR-04: prune dated snapshot dirs older than RETENTION_DAYS. current/
                  # is never pruned (it is the live incremental mirror).
                  echo "[3/3] Pruning dated snapshots older than ${RETENTION_DAYS} days..."
                  CUTOFF_EPOCH=$(date -u -d "-${RETENTION_DAYS} days" +%s 2>/dev/null \
                    || date -u -v "-${RETENTION_DAYS}d" +%s 2>/dev/null || echo 0)
                  find /mnt/backup -maxdepth 1 -mindepth 1 -type d -name "20??-??-??" | while read -r OLD_DIR; do
                    DIR_NAME=$(basename "${OLD_DIR}")
                    # Convert YYYY-MM-DD to epoch for comparison
                    DIR_EPOCH=$(date -u -d "${DIR_NAME}" +%s 2>/dev/null \
                      || date -u -j -f "%Y-%m-%d" "${DIR_NAME}" +%s 2>/dev/null || echo 0)
                    if [ "${CUTOFF_EPOCH}" -gt 0 ] && [ "${DIR_EPOCH}" -gt 0 ] && [ "${DIR_EPOCH}" -lt "${CUTOFF_EPOCH}" ]; then
                      echo "[3/3] Removing stale snapshot dir: ${OLD_DIR}"
                      rm -rf "${OLD_DIR}"
                    fi
                  done
                  echo "[3/3] Retention pruning complete"

                  echo "[backup-seaweedfs] SUCCESS — mirror complete: ${SNAPSHOT_DIR} (${OBJECT_COUNT} objects)"

              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
{{- end }}
