{{/*
seaweedfs-s3-secret.yaml — Secret clubcore-seaweedfs-s3

T-118-13: SeaweedFS S3 identity Secret — reproduces the s3.json "identities" structure
that SeaweedFS expects when s3.enableAuth: true is set in the subchart values.

The Secret name "clubcore-seaweedfs-s3" is referenced by values.yaml:
  seaweedfs.s3.existingConfigSecret: clubcore-seaweedfs-s3

Structure mirrors apps/backend/docker/seaweedfs-s3.json verbatim.
The credential values (accessKey / secretKey) MUST match what the backend sends
via S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in app-secret.yaml (T-118-13).

The identity "name" in s3.json is a label only (SeaweedFS uses it for logging);
the credential pair (accessKey + secretKey) is what authenticates the client.
The actions list grants Admin+Read+Write+List+Tagging — full access for the app bucket.

WARNING — PHASE 119 SEC-01 REPLACEMENT NOTICE:
  These credentials are stored PLAINTEXT for LOCAL K3D DEVELOPMENT ONLY.
  Phase 119 SEC-01 seals all Secrets including this one.
  NEVER use these plaintext values on a live/production server.

SeaweedFS S3 config key in the Secret:
  The subchart reads the config from a key named "config.json" (or the path it looks for).
  Per SeaweedFS Helm chart v4.33.0 schema, the Secret key for existingConfigSecret
  must be "s3.json" — SeaweedFS mounts this file at the expected config path.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-seaweedfs-s3
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
  annotations:
    # T-118-13: Phase 119 SEC-01 replaces plaintext with SealedSecret.
    clubcore.io/replace-with-sealed-secret: "phase-119-sec-01"
    clubcore.io/secret-type: "seaweedfs-s3-identities"
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # s3.json — SeaweedFS S3 identities configuration
  # Reproduces apps/backend/docker/seaweedfs-s3.json structure verbatim.
  # The credential values MUST match S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
  # in app-secret.yaml so enableAuth: true authenticates the backend client.
  # ---------------------------------------------------------------------------
  s3.json: |
    {
      "identities": [
        {
          "name": "clubcore",
          "credentials": [
            {
              "accessKey": {{ .Values.secrets.s3AccessKeyId | required "secrets.s3AccessKeyId is required" | quote }},
              "secretKey": {{ .Values.secrets.s3SecretAccessKey | required "secrets.s3SecretAccessKey is required" | quote }}
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
