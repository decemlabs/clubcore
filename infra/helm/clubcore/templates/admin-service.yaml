{{/*
admin-service.yaml — ClusterIP Service clubcore-admin

Exposes the admin nginx Deployment on port 8080 within the cluster.
This is the Ingress backend target for the admin host (NET-01).

Service name: {{ include "clubcore.fullname" . }}-admin
In-cluster DNS: <release>-admin.<namespace>.svc.cluster.local:8080
Short DNS:      <release>-admin:8080  (within same namespace)

With release name "clubcore": clubcore-admin:8080
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clubcore.fullname" . }}-admin
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  selector:
    {{- include "clubcore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
