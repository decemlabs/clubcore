{{/*
client-service.yaml — ClusterIP Service clubcore-client

Exposes the client nginx Deployment on port 8080 within the cluster.
This is the Ingress backend target for the client host (NET-01 / NET-04).

Service name: {{ include "clubcore.fullname" . }}-client
In-cluster DNS: <release>-client.<namespace>.svc.cluster.local:8080
Short DNS:      <release>-client:8080  (within same namespace)

With release name "clubcore": clubcore-client:8080
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clubcore.fullname" . }}-client
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  type: ClusterIP
  selector:
    {{- include "clubcore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: client
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
