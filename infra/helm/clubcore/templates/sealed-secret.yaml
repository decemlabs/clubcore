{{/*
sealed-secret.yaml — SealedSecret clubcore-app-secret (bitnami.com/v1alpha1)

╔══════════════════════════════════════════════════════════════════════════════╗
║  SEC-01 PRODUCTION PATH: sealed-secrets v0.37.0                            ║
║                                                                              ║
║  This template renders ONLY when secrets.sealed.enabled = true.             ║
║  The SealedSecret is the ONLY production-safe way to commit app secrets.    ║
║  Encrypted blobs (encryptedData) are RSA-encrypted by kubeseal against the  ║
║  sealed-secrets controller's public certificate — NEVER plaintext.          ║
║                                                                              ║
║  ┌──────────────────────────────────────────────────────────────────────┐   ║
║  │  INVARIANT: NO plaintext stringData is EVER committed to git here.   │   ║
║  │  Every field contains RSA-encrypted ciphertext produced by kubeseal. │   ║
║  └──────────────────────────────────────────────────────────────────────┘   ║
║                                                                              ║
║  To generate/update:                                                         ║
║    bash infra/scripts/seal-secrets.sh                                        ║
║  Then set in values-override.yaml (NEVER in the committed values.yaml):      ║
║    secrets.sealed.encryptedData.<KEY>: "<kubeseal-ciphertext>"               ║
║                                                                              ║
║  SEC-02 HARD GATE: The controller RSA private key MUST be backed up          ║
║  off-node before any production deploy.                                       ║
║  See: infra/runbooks/sealed-secrets-key-backup.md                            ║
╚══════════════════════════════════════════════════════════════════════════════╝

The controller unseals this SealedSecret into a regular kubernetes.io/Opaque
Secret with the same metadata.name — matching the Secret that app-secret.yaml
produces for local k3d.  All workloads consume it via envFrom without change.

Scope: namespaced (default).  The SealedSecret is tied to the Release.Namespace
and the Secret name — it cannot be moved to another namespace without re-sealing.
*/}}
{{- if .Values.secrets.sealed.enabled }}
{{/* ╔══════════════════════════════════════════════════════════════════════════╗
     ║  PRODUCTION SECRETS PATH — sealed-secrets v0.37.0 (SEC-01)             ║
     ║  Rendered because secrets.sealed.enabled=true                           ║
     ║  encryptedData blobs produced by: bash infra/scripts/seal-secrets.sh    ║
     ╚══════════════════════════════════════════════════════════════════════════╝ */}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "clubcore.fullname" . }}-app-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
  annotations:
    # namespaced scope: this SealedSecret is bound to both the namespace AND the
    # Secret name.  Re-seal if you rename the release or move to another namespace.
    # To use cluster-wide scope instead: sealedsecrets.bitnami.com/cluster-wide: "true"
    sealedsecrets.bitnami.com/namespace-wide: "false"
    clubcore.io/secret-path: "sealed-production"
    clubcore.io/secret-type: "app-env"
    # SEC-02: controller RSA key must be backed up off-node.
    # See: infra/runbooks/sealed-secrets-key-backup.md
    clubcore.io/sec02-key-backup: "see-infra/runbooks/sealed-secrets-key-backup.md"
spec:
  # The controller will unseal this into an Opaque Secret with the same name.
  # encryptedData values are produced by:
  #   bash infra/scripts/seal-secrets.sh
  # and stored in a values override file (NOT committed values.yaml).
  encryptedData:
    SECRET_KEY: {{ .Values.secrets.sealed.encryptedData.SECRET_KEY | required "secrets.sealed.encryptedData.SECRET_KEY is required when secrets.sealed.enabled=true — run: bash infra/scripts/seal-secrets.sh" | quote }}
    DATABASE_URL: {{ .Values.secrets.sealed.encryptedData.DATABASE_URL | required "secrets.sealed.encryptedData.DATABASE_URL is required when secrets.sealed.enabled=true — run: bash infra/scripts/seal-secrets.sh" | quote }}
    TELEGRAM_BOT_TOKEN: {{ .Values.secrets.sealed.encryptedData.TELEGRAM_BOT_TOKEN | default "" | quote }}
    S3_ACCESS_KEY_ID: {{ .Values.secrets.sealed.encryptedData.S3_ACCESS_KEY_ID | required "secrets.sealed.encryptedData.S3_ACCESS_KEY_ID is required when secrets.sealed.enabled=true — run: bash infra/scripts/seal-secrets.sh" | quote }}
    S3_SECRET_ACCESS_KEY: {{ .Values.secrets.sealed.encryptedData.S3_SECRET_ACCESS_KEY | required "secrets.sealed.encryptedData.S3_SECRET_ACCESS_KEY is required when secrets.sealed.enabled=true — run: bash infra/scripts/seal-secrets.sh" | quote }}
    EMAIL__AWS_ACCESS_KEY_ID: {{ .Values.secrets.sealed.encryptedData.EMAIL__AWS_ACCESS_KEY_ID | default "" | quote }}
    EMAIL__AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.sealed.encryptedData.EMAIL__AWS_SECRET_ACCESS_KEY | default "" | quote }}
    EMAIL__WEBHOOK_SECRET: {{ .Values.secrets.sealed.encryptedData.EMAIL__WEBHOOK_SECRET | default "" | quote }}
  template:
    metadata:
      name: {{ include "clubcore.fullname" . }}-app-secret
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "clubcore.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
{{/* End SEC-01 sealed-production gate */}}
