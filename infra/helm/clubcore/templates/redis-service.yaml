{{/*
Redis headless Service

Headless (clusterIP: None) so StatefulSet pods get stable DNS:
  clubcore-redis-0.clubcore-redis.<namespace>.svc.cluster.local

The backend REDIS_URL (plan 03 ConfigMap) uses the service name:
  redis://clubcore-redis:6379/0

Note: for a single-replica StatefulSet, the headless service provides
both stable pod DNS and the service-level DNS (clubcore-redis:6379).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clubcore.fullname" . }}-redis
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  # Headless service — required by StatefulSet for stable pod DNS
  clusterIP: None
  selector:
    {{- include "clubcore.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
