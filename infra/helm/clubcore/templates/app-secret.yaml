{{/*
app-secret.yaml — Secret clubcore-app-secret (Opaque) — LOCAL K3D ONLY

SENSITIVE environment variables ONLY (APP-05 / T-118-10).

╔══════════════════════════════════════════════════════════════════════════════╗
║  SEC-01 / PHASE 119 WARNING: PLAINTEXT SECRET — LOCAL K3D ONLY            ║
║                                                                              ║
║  This template renders ONLY when secrets.plaintextForLocalK3d = true        ║
║  (the default for local k3d development).                                    ║
║                                                                              ║
║  For production use sealed-secret.yaml (secrets.sealed.enabled=true).       ║
║  The SealedSecret is the ONLY production-safe path — the controller RSA key  ║
║  encrypts secrets before git commit; plaintext never reaches the repo or a   ║
║  live server.                                                                ║
║                                                                              ║
║  NEVER set secrets.plaintextForLocalK3d=true on a live/production server.   ║
╚══════════════════════════════════════════════════════════════════════════════╝

Sensitive keys housed here:
  - SECRET_KEY                     (JWT signing key, required SecretStr)
  - DATABASE_URL                   (contains DB password component → CNPG -rw service)
  - TELEGRAM_BOT_TOKEN             (SecretStr; placeholder safe for dev)
  - S3_ACCESS_KEY_ID               (SeaweedFS S3 access key, must match seaweedfs-s3-secret.yaml)
  - S3_SECRET_ACCESS_KEY           (SeaweedFS S3 secret key, must match seaweedfs-s3-secret.yaml)
  - EMAIL__AWS_ACCESS_KEY_ID       (Yandex Postbox AWS credential, nullable)
  - EMAIL__AWS_SECRET_ACCESS_KEY   (Yandex Postbox AWS credential, nullable)
  - EMAIL__WEBHOOK_SECRET          (Yandex Postbox webhook HMAC secret)

DATABASE_URL construction:
  postgresql+asyncpg://app:<password>@<fullname>-postgres-rw:5432/clubcore
  The password reuses .Values.postgres.password (single source of truth from plan 02).
  The CNPG -rw service DNS = <fullname>-postgres-rw where <fullname> is the
  clubcore.fullname helper (same basis the CNPG Cluster is named with), NOT the
  bare release name — otherwise the host diverges for any release not containing
  "clubcore" (CR-01 fix).

Cross-reference: ConfigMap clubcore-config carries the non-sensitive complements.
Both ConfigMap + Secret are consumed via envFrom in every workload (plan 04) and the
migrate Job (migrate-job.yaml in this plan).
*/}}
{{- if .Values.secrets.plaintextForLocalK3d }}
{{/* ╔══════════════════════════════════════════════════════════════════════════╗
     ║  PLAINTEXT SECRET PATH — LOCAL K3D DEVELOPMENT ONLY (SEC-01)          ║
     ║  Rendered because secrets.plaintextForLocalK3d=true (default for k3d)  ║
     ║  NEVER use this path on a live server — use sealed-secret.yaml instead  ║
     ╚══════════════════════════════════════════════════════════════════════════╝ */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clubcore.fullname" . }}-app-secret
  labels:
    {{- include "clubcore.labels" . | nindent 4 }}
  annotations:
    # SEC-01: plaintext path — local k3d ONLY. Production path = sealed-secret.yaml.
    # Run `bash infra/scripts/seal-secrets.sh` + set secrets.sealed.enabled=true
    # and secrets.plaintextForLocalK3d=false before any live/production deploy.
    clubcore.io/secret-path: "plaintext-local-k3d-only"
    clubcore.io/secret-type: "app-env"
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # JWT signing key — required, no default (app refuses to start without it)
  # ---------------------------------------------------------------------------
  SECRET_KEY: {{ .Values.secrets.secretKey | required "secrets.secretKey is required" | quote }}

  # ---------------------------------------------------------------------------
  # DATABASE_URL — constructed to point at the CNPG -rw service (plan 02 SUMMARY).
  # Single-source password: reuses .Values.postgres.password from plan 02.
  # Format: postgresql+asyncpg://app:<password>@<fullname>-postgres-rw:5432/clubcore
  # Host uses clubcore.fullname (same basis as the CNPG Cluster name) so DNS resolves
  # for ANY release name, not just one literally named "clubcore" (CR-01 fix).
  # ---------------------------------------------------------------------------
  DATABASE_URL: {{ printf "postgresql+asyncpg://app:%s@%s-postgres-rw:5432/clubcore" .Values.postgres.password (include "clubcore.fullname" .) | quote }}

  # ---------------------------------------------------------------------------
  # Telegram bot token — SecretStr; placeholder sentinel safe for dev (config.py line 80)
  # ---------------------------------------------------------------------------
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | default "placeholder-telegram-bot-token-not-real" | quote }}

  # ---------------------------------------------------------------------------
  # S3 / SeaweedFS credentials — must match identities in seaweedfs-s3-secret.yaml
  # so that enableAuth: true authenticates the backend client (T-118-13)
  # ---------------------------------------------------------------------------
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | required "secrets.s3AccessKeyId is required" | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | required "secrets.s3SecretAccessKey is required" | quote }}

  # ---------------------------------------------------------------------------
  # Email provider AWS credentials (Yandex Postbox / SES-compatible)
  # Optional — only required when EMAIL__PROVIDER != "sandbox"
  # ---------------------------------------------------------------------------
  {{- if .Values.secrets.emailAwsAccessKeyId }}
  EMAIL__AWS_ACCESS_KEY_ID: {{ .Values.secrets.emailAwsAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.emailAwsSecretAccessKey }}
  EMAIL__AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.emailAwsSecretAccessKey | quote }}
  {{- end }}

  # ---------------------------------------------------------------------------
  # Email webhook HMAC secret (Yandex Postbox bounce/delivery callbacks)
  # Optional — only required when EMAIL__PROVIDER != "sandbox"
  # ---------------------------------------------------------------------------
  EMAIL__WEBHOOK_SECRET: {{ .Values.secrets.emailWebhookSecret | default "" | quote }}
{{- end }}
{{/* End SEC-01 plaintext-local-k3d-only gate */}}
