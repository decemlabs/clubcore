# clubcore Helm umbrella chart — values.yaml
# Single source of truth for all image tags, storage knobs, and service configuration.
#
# Image tags reference the git-SHA produced by infra/scripts/build-images.sh (plan 118-01).
# Override at deploy time: --set image.tag=$(git rev-parse --short HEAD)

# ---------------------------------------------------------------------------
# Global image settings
# ---------------------------------------------------------------------------
image:
  repository: clubcore/backend
  # WR-02: tag is intentionally EMPTY — it MUST be supplied at deploy time so a
  # stale hard-coded SHA can never be silently deployed. build-images.sh prints
  # the tag; deploy-local.sh passes it via --set image.tag=<sha>. A manual
  # `helm install`/`helm template` without --set image.tag fails loudly via the
  # `required` guard in templates/_helpers.tpl (clubcore.image).
  # Override at deploy time: helm upgrade clubcore . --set image.tag=$(git rev-parse --short HEAD)
  tag: ""
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# StorageClass (DATA-04 / P1 invariant)
# reclaimPolicy: Retain is HARD-CODED in storageclass.yaml — not configurable here.
# This value only controls the name used by all PVC references.
# ---------------------------------------------------------------------------
storageClass:
  name: clubcore-retain

# ---------------------------------------------------------------------------
# Postgres (CloudNativePG Cluster) — DATA-01 / P1 invariant
# D-V40-BITNAMI-PAYWALLED: CNPG ghcr.io images ONLY — NO Bitnami.
# instances: 1 — single bare-metal node; not a tuning knob (DATA-01).
# nodeSelector pins the Postgres pod so its PVC node-affinity never strands data (P1).
# ---------------------------------------------------------------------------
postgres:
  # CNPG operator must be pre-installed before this chart.
  # Install: kubectl apply -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.27/releases/cnpg-1.27.0.yaml
  instances: 1
  # ghcr.io/cloudnative-pg/postgresql:<version> — NO Bitnami.
  # 16.6 is the latest patch of PG 16 at time of authoring (2026-06-16).
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.6"

  # Database bootstrap config
  database: clubcore
  owner: app
  # Secret name holding the app-user credentials (kubernetes.io/basic-auth)
  # Authored in postgres-app-secret.yaml (plan 02) and replaced with SealedSecret in Phase 119.
  appSecretName: clubcore-postgres-app

  # Storage on the Retain StorageClass
  storage:
    size: "10Gi"
    # References storageClass.name above
    storageClass: ""  # empty = use storageClass.name

  # DATA-04 / P1: nodeSelector pins Postgres pod to a specific node label.
  # Default: kubernetes.io/hostname=k3d-clubcore-server-0 (k3d single-node default).
  # Override for production: --set postgres.nodeSelector."kubernetes\.io/hostname"=<node>
  nodeSelector:
    kubernetes.io/hostname: k3d-clubcore-server-0

  # Resource limits — single-node tuned (modest for k3d dev)
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # Superuser access disabled (least privilege — T-118-07)
  enableSuperuserAccess: false

  # PHASE 120 SCOPE: backup.barmanObjectStore is NOT configured here.
  # See Phase 120 plan (BAK-01) for CNPG WAL archiving to SeaweedFS S3.

  # Local dev password — PLAINTEXT FOR LOCAL K3D ONLY.
  # WARNING: Phase 119 SEC-01 replaces this with a SealedSecret.
  #          NEVER use this plaintext value on a live/production server.
  #          This value is intentionally weak for local k3d development only.
  password: "clubcore-dev-pg-password-change-in-phase119"

# ---------------------------------------------------------------------------
# Redis StatefulSet — DATA-02
# Plain redis:7-alpine (NO Bitnami — D-V40-BITNAMI-PAYWALLED).
# AOF + maxmemory + allkeys-lru are DATA-02 acceptance criteria — hard config.
# ---------------------------------------------------------------------------
redis:
  image: "redis:7-alpine"

  # DATA-02 AOF settings (rendered into redis.conf ConfigMap)
  # appendonly: yes — must be set to "yes" in ConfigMap (string, not bool)
  # appendfsync: everysec — balance between performance and durability
  maxmemory: "256mb"
  # maxmemory-policy: allkeys-lru — evict LRU keys when maxmemory is reached

  storage:
    size: "2Gi"
    # References storageClass.name above

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---------------------------------------------------------------------------
# SeaweedFS — DATA-03 (S3-compatible object storage)
# D-V40-MINIO-RETIRED: MinIO community repo archived April 2026; SeaweedFS replaces it.
# Helm subchart v4.33.0 from https://seaweedfs.github.io/seaweedfs/helm
# Zero app-code change: same boto3/aioboto3 env vars as docker-compose (DATA-03).
# T-118-09: s3.enableAuth: true — anonymous access blocked.
# ---------------------------------------------------------------------------
seaweedfs:
  # Set to false to skip SeaweedFS during local testing without S3
  enabled: true

  # S3 API configuration
  s3:
    enabled: true
    port: 8333
    # T-118-09: anonymous S3 access blocked
    enableAuth: true
    # Secret holding s3.json identities (authored in plan 03 alongside other Secrets).
    # Structure mirrors docker/seaweedfs-s3.json (see templates/seaweedfs-values.yaml).
    existingConfigSecret: clubcore-seaweedfs-s3

  # Standalone single-replica topology (v4.0 single-node)
  master:
    replicas: 1
    data:
      type: persistentVolumeClaim
      storageClass: clubcore-retain
      size: "5Gi"

  volume:
    replicas: 1
    data:
      type: persistentVolumeClaim
      storageClass: clubcore-retain
      size: "20Gi"

  filer:
    replicas: 1
    data:
      type: persistentVolumeClaim
      storageClass: clubcore-retain
      size: "1Gi"

# ---------------------------------------------------------------------------
# Application ConfigMap — non-sensitive env vars (APP-05)
# All keys here become entries in the ConfigMap clubcore-config.
# Sensitive keys must NEVER appear here — use secrets.* below.
# ---------------------------------------------------------------------------
config:
  # Runtime environment — must NOT be "dev" (config.py dev_otp_pin_guard validator).
  environment: "prod"
  debug: "false"

  # Redis in-cluster service DNS (plan 02: redis-service.yaml, clusterIP: None)
  # Default is derived from Release.Name in app-configmap.yaml; override here if needed.
  redisUrl: ""  # empty = auto-derive as redis://<release>-redis:6379/0

  # S3 / SeaweedFS (DATA-03 zero-app-code-change)
  # S3_ENDPOINT_URL auto-derived from release name; override if using external S3.
  s3EndpointUrl: ""    # empty = auto-derive as http://<release>-seaweedfs-s3:8333
  s3Bucket: "clubcore"
  s3Region: "ru-central1"

  # Frontend / PWA URLs — override for production domain
  frontendBaseUrl: "https://admin.clubcore.ru"
  pwaBaseUrl: "https://app.clubcore.ru"

  # WebSocket CSWSH allowlist — JSON array of allowed Origins.
  # For local k3d: '["http://localhost:5173","http://localhost:5174"]'
  # For production: '["https://admin.clubcore.ru","https://app.clubcore.ru"]'
  wsAllowedOrigins: "[]"

  # Telegram (non-sensitive: username only)
  telegramBotUsername: "clubcore_bot"

  # JWT / session TTL knobs (seconds)
  accessTokenTtlSeconds: "900"
  refreshTokenTtlSeconds: "2592000"
  qrTokenTtlSeconds: "60"

  # Email provider routing — non-sensitive mode/routing knobs only
  # Credentials go to secrets.emailAwsAccessKeyId / emailAwsSecretAccessKey
  emailProvider: "sandbox"
  emailFromAddress: "noreply@mail.clubcore.ru"
  emailFromDomain: ""
  emailSandboxMode: "false"

  # Optional email FROM override (CLUBCORE_EMAIL_FROM).
  # Set to a valid email address to override EmailProviderSettings.from_address.
  clubcoreEmailFrom: ""

# ---------------------------------------------------------------------------
# Application Secret — sensitive env vars (APP-05 / T-118-10)
#
# SEC-01 TWO-PATH ARCHITECTURE:
#
#   PATH A — Local k3d (plaintextForLocalK3d: true, sealed.enabled: false):
#     Renders app-secret.yaml with plaintext stringData.
#     ONLY for local k3d development. NEVER for live/production servers.
#
#   PATH B — Production (plaintextForLocalK3d: false, sealed.enabled: true):
#     Renders sealed-secret.yaml with RSA-encrypted encryptedData.
#     encryptedData blobs are produced by: bash infra/scripts/seal-secrets.sh
#     SEC-02 HARD GATE: controller RSA key must be backed up off-node FIRST.
#     See: infra/runbooks/sealed-secrets-key-backup.md
#
# Only ONE path should be active at a time (both can be false — no Secret rendered).
# ---------------------------------------------------------------------------
secrets:
  # ─── SEC-01 path switches ────────────────────────────────────────────────
  # plaintextForLocalK3d: true  → renders app-secret.yaml (plaintext, k3d dev only)
  # plaintextForLocalK3d: false → no plaintext Secret rendered (use sealed path)
  # WARNING: NEVER set this to true on a live/production server.
  plaintextForLocalK3d: true

  # SEC-01 sealed-secrets production path
  sealed:
    # sealed.enabled: false → production SealedSecret not rendered (default: use plaintext k3d path)
    # sealed.enabled: true  → renders sealed-secret.yaml (RSA-encrypted, production path)
    # To enable: run `bash infra/scripts/seal-secrets.sh` first, then set encryptedData below.
    enabled: false

    # encryptedData: RSA-encrypted ciphertext produced by kubeseal.
    # NEVER put plaintext values here. NEVER commit production ciphertext in values.yaml.
    # Use a SEPARATE values-production.yaml (not committed to git) for real ciphertext:
    #   helm upgrade ... -f /path/to/values-production.yaml
    # The placeholders below are empty — they will trigger `required` errors in the
    # template if sealed.enabled=true but encryptedData is not populated.
    encryptedData: {}
    # encryptedData:
    #   SECRET_KEY: "AgABC..."          # populated by seal-secrets.sh
    #   DATABASE_URL: "AgABC..."        # populated by seal-secrets.sh
    #   TELEGRAM_BOT_TOKEN: "AgABC..."  # populated by seal-secrets.sh
    #   S3_ACCESS_KEY_ID: "AgABC..."    # populated by seal-secrets.sh
    #   S3_SECRET_ACCESS_KEY: "AgABC..." # populated by seal-secrets.sh
    #   EMAIL__AWS_ACCESS_KEY_ID: ""    # optional — leave empty for sandbox mode
    #   EMAIL__AWS_SECRET_ACCESS_KEY: "" # optional
    #   EMAIL__WEBHOOK_SECRET: ""       # optional

  # ─── PATH A plaintext values (local k3d development only) ────────────────
  # JWT signing key — required, strong random value for prod (generate with openssl rand -hex 32)
  # LOCAL K3D DEFAULT ONLY — CHANGE FOR PRODUCTION.
  secretKey: "clubcore-dev-secret-key-change-in-phase119-not-for-prod"

  # Telegram bot token — SecretStr; placeholder sentinel safe for dev.
  # Set to the real @BotFather token for production.
  telegramBotToken: "placeholder-telegram-bot-token-not-real"

  # S3 / SeaweedFS credentials — MUST match identities in seaweedfs-s3-secret.yaml
  # (T-118-13: enableAuth: true authenticates the real client only).
  # LOCAL K3D DEFAULTS — CHANGE FOR PRODUCTION.
  s3AccessKeyId: "clubcore-s3-access-key"
  s3SecretAccessKey: "clubcore-s3-secret-key-change-in-phase119"

  # Email provider AWS credentials (Yandex Postbox / SES-compatible).
  # Leave empty when EMAIL__PROVIDER=sandbox (default for dev/local k3d).
  emailAwsAccessKeyId: ""
  emailAwsSecretAccessKey: ""

  # Email webhook HMAC secret (Yandex Postbox bounce/delivery callbacks).
  # Required when EMAIL__PROVIDER != "sandbox". Empty = sandbox mode (dev default).
  emailWebhookSecret: ""

# ---------------------------------------------------------------------------
# Alembic migrate Job — hook resource knobs (APP-01)
# Architectural values (P4 invariant) are HARD-CODED in migrate-job.yaml:
#   backoffLimit: 0, activeDeadlineSeconds: 300, hook annotations.
# Only resource requests/limits and optional timeout override are tunable here.
# ---------------------------------------------------------------------------
migrate:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Optional per-deploy timeout override (seconds).
  # If set, overrides the hard-coded activeDeadlineSeconds: 300.
  # WARNING: the P4 architectural invariant requires a finite timeout — do not
  # set this to 0 (infinite). The default 300s is the architectural minimum.
  activeDeadlineSeconds: 300

# ---------------------------------------------------------------------------
# Backend Deployment — APP-02
# Probes and replica count for the uvicorn API server.
# replicas: 1 — D-V40-REPLICAS constraint for v4.0 single-node.
# TZ=UTC arrives via envFrom → clubcore-config (P9 invariant — NOT set here).
# ---------------------------------------------------------------------------
backend:
  # D-V40-REPLICAS: single bare-metal node, v4.0 constraint.
  # Do NOT increase without adding session/state sharing strategy.
  replicas: 1

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

  probes:
    startup:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 30   # 300s max cold-boot window (uvicorn + db pool init)
      timeoutSeconds: 3
    liveness:
      periodSeconds: 30
      failureThreshold: 3
      timeoutSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3

# ---------------------------------------------------------------------------
# arq-worker Deployment — APP-03
# ARCHITECTURAL INVARIANT: replicas is NOT exposed here (fixed at 1 in template).
# Only resource requests/limits are tunable.
# See arq-worker-deployment.yaml for the D-V40-REPLICAS + Recreate rationale.
# ---------------------------------------------------------------------------
arqWorker:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ---------------------------------------------------------------------------
# telegram-bot Deployment — APP-04
# ARCHITECTURAL INVARIANT: replicas is NOT exposed here (fixed at 1 in template).
# Only resource requests/limits are tunable.
# See telegram-bot-deployment.yaml for the D-V40-REPLICAS + Recreate rationale.
# ---------------------------------------------------------------------------
telegramBot:
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ---------------------------------------------------------------------------
# admin-app Deployment — NET-04 (IMG-03 gap close)
# Static nginx frontend workload; port 8080 (non-root nginx user, UID 101).
# replicas: 1 — D-V40-REPLICAS constraint; increase only after adding a proper
# session-sharing strategy (no server-side state in static frontends, but Traefik
# LB across replicas needs the same backend pod for long-lived WS connections).
# image.tag is shared with the backend image (same git-SHA, see build-images.sh).
# ---------------------------------------------------------------------------
adminApp:
  replicas: 1

  image:
    repository: clubcore/admin-app
    # tag: inherited from global image.tag (same git-SHA for all images)

  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ---------------------------------------------------------------------------
# client-pwa Deployment — NET-04 (IMG-03 gap close)
# Static nginx PWA workload; port 8080 (non-root nginx user, UID 101).
# NET-04 SPA/SW behavior is encoded in infra/nginx/client-pwa.conf (Phase 118):
#   sw.js + manifest.json: Cache-Control: no-cache
#   /api/*:                Cache-Control: no-store (defence-in-depth, T-118-05)
#   hashed assets:         immutable (max-age=31536000)
#   index.html:            no-cache, no-store, must-revalidate
# These headers are inherited end-to-end through the Traefik Ingress.
# ---------------------------------------------------------------------------
clientPwa:
  replicas: 1

  image:
    repository: clubcore/client-pwa
    # tag: inherited from global image.tag (same git-SHA for all images)

  resources:
    requests:
      cpu: "25m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ---------------------------------------------------------------------------
# Ingress — NET-01/NET-02 (Traefik v3 + HTTP→HTTPS redirect + WS routing)
# Requires Traefik v3 (bundled with k3s) as the ingress controller.
# enabled: false by default — set to true at deploy time or via --set ingress.enabled=true.
#
# TLS: references the cert-manager Certificate secret (certManager.tlsSecretName).
# HTTP→HTTPS: Traefik Middleware attached via router.middlewares annotation.
# WebSocket (NET-02): Traefik v3 upgrades WS connections automatically over a
#   standard HTTP router — no sticky-session or special WS annotation required.
#   The chat endpoint /api/v1/client/ws/messages is reached via the API host rule.
# ---------------------------------------------------------------------------
ingress:
  enabled: false

  # Ingress class name (Traefik v3 bundled with k3s).
  className: traefik

  hosts:
    # API backend — routed to clubcore-backend:8000.
    # Also covers the WebSocket chat path /api/v1/client/ws/messages.
    api: "api.clubcore.ru"
    # Admin staff SPA — routed to clubcore-admin-app:8080.
    adminApp: "admin.clubcore.ru"
    # Client PWA — routed to clubcore-client-pwa:8080.
    clientPwa: "app.clubcore.ru"

  # TLS secret name — must match Certificate.spec.secretName (certManager.tlsSecretName).
  tlsSecretName: "clubcore-tls"

  # Issuer name for the router.middlewares annotation namespace resolution.
  # Used in the Middleware reference: <namespace>-<fullname>-https-redirect@kubernetescrd
  issuerName: "clubcore-selfsigned"

# ---------------------------------------------------------------------------
# cert-manager — NET-03 (TLS certificates for the Ingress)
# Requires cert-manager operator pre-installed in the cluster.
# enabled: false by default — set to true at deploy time or via --set certManager.enabled=true.
#
# Issuer chain:
#   selfSigned:         local k3d (done-bar for Phase 119 — enabled by default when enabled=true)
#   letsencryptStaging: iterative ACME testing (disabled by default — enable when ACME is ready)
#   letsencrypt-prod:   OPERATOR-PENDING — intentionally NOT authored here (D-V40-LOCAL-VALIDATE).
#                       Do NOT set certManager.issuerName to letsencrypt-prod until
#                       the operator has verified the staging ACME flow succeeds.
# ---------------------------------------------------------------------------
certManager:
  enabled: false

  # Name of the ClusterIssuer to use for the Certificate issuerRef.
  # Default: selfSigned ClusterIssuer (local k3d).
  # For iterative testing: set to "clubcore-letsencrypt-staging"
  # For production: OPERATOR-PENDING (LE-prod issuer not authored — see cluster-issuer.yaml).
  issuerName: "clubcore-selfsigned"

  # TLS secret name — must match ingress.tlsSecretName.
  tlsSecretName: "clubcore-tls"

  # ACME email for letsencrypt-staging issuer (required when letsencryptStaging.enabled=true).
  acmeEmail: "ops@clubcore.ru"

  selfSigned:
    # Enabled by default (local k3d done-bar).
    enabled: true

  letsencryptStaging:
    # Disabled by default — enable for iterative ACME testing.
    # Requires a publicly reachable ACME http01 endpoint.
    enabled: false

# ---------------------------------------------------------------------------
# Optional overrides
# ---------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
