# admin nginx configuration
# Non-root nginx: listen on port 8080 (unprivileged, T-118-04).
# SPA try_files fallback for TanStack Router (client-side routing).

# Nginx user (non-root) writes pid and tmp files here.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Use writable temp dirs for the nginx user (non-root).
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback: serve index.html for any unmatched route (P10 client-side routing).
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed static assets (JS, CSS bundles with content hash in filename)
        # can be cached aggressively — the hash changes with each build.
        location ~* \.(js|css|woff2?|ttf|eot|otf|ico|png|svg|jpg|jpeg|gif|webp)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # index.html must never be cached — it references the hashed assets.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Health check path for Kubernetes liveness probes.
        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
