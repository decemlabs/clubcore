# client (PWA) nginx configuration — LOCAL DOCKER-COMPOSE ONLY.
# Same as client.conf but the /api block reverse-proxies to the backend service
# instead of returning 404. In k8s the ingress (Phase 119) routes /api → backend;
# locally there is no ingress, so this SPA nginx layer proxies /api itself.
# Mounted as a volume override over /etc/nginx/nginx.conf in the local compose.
# DO NOT use in production — prod uses infra/nginx/client.conf (no /api upstream).

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile        on;
    keepalive_timeout  65;

    # WebSocket upgrade mapping (chat real-time layer talks over /api WS).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # LOCAL ONLY: reverse-proxy /api → backend service (compose network).
        # Never cache authed API data (defence-in-depth).
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 75s;
            add_header Cache-Control "no-store" always;
        }

        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            add_header Service-Worker-Allowed "/";
        }

        location = /manifest.json {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location = /manifest.webmanifest {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        location ~* \.(js|css|woff2?|ttf|eot|otf|ico|png|svg|jpg|jpeg|gif|webp)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /healthz {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
