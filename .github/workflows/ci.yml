name: CI

on:
  pull_request:
  push:
    branches: [main]

# D-03: cancel stale runs on push-to-PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN. The drift-gate jobs only read the repo —
# they never push, comment, or release. Mitigates workflow-injection
# blast radius (Phase 9 threat T-09-13).
permissions:
  contents: read

jobs:
  backend:
    name: Backend (drift gates + statics)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: clubcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d clubcore"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/clubcore
      REDIS_URL: redis://localhost:6379/0
      # CI-only throwaway value — Settings.secret_key is required (no default).
      # Declared explicitly here so the pytest gate fails with a clear config
      # error rather than depending on conftest.py's implicit .env.example load.
      SECRET_KEY: ci-only-test-secret-key-not-real-0123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check

      - name: ruff format --check
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy --strict app

      - name: lint-imports
        run: uv run lint-imports

      - name: Export OpenAPI spec
        run: uv run python -m scripts.export_openapi

      # D-02 / API-02: any Pydantic schema change that did not regenerate
      # apps/backend/openapi.json fails this step.
      #
      # WR-06: assert the file is tracked before diffing. `git diff --exit-code`
      # silently passes (exit 0) when the path is untracked or gitignored, so
      # without `git ls-files --error-unmatch` a misconfiguration could turn
      # the drift gate into a no-op.
      - name: Drift gate — apps/backend/openapi.json
        working-directory: ${{ github.workspace }}
        run: |
          git ls-files --error-unmatch apps/backend/openapi.json
          git diff --exit-code apps/backend/openapi.json

      # VER-02 / D-72-08: run the full pytest suite against the live Postgres +
      # Redis service containers with a migrated schema. The IDOR / anti-oracle /
      # two-principal tests (client_portal/test_idor_sweep.py,
      # client_auth/test_idor.py, client_auth/test_byte_parity.py,
      # client_auth/test_otp_isolation.py) skip if DATABASE_URL is unreachable
      # (conftest.py L79/L87). With the service containers above they EXECUTE.
      - name: Migrate schema
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest

  frontend:
    name: Frontend (drift gates + statics)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # W-02 fix: pin pnpm major version explicitly. Without `version: 9`,
      # pnpm/action-setup@v3 reads root package.json `packageManager` field;
      # if absent, it falls back to a runner-image default which can drift
      # between GitHub Actions image releases — causing nondeterministic
      # dependency resolution and silent lockfile churn that undermines
      # `pnpm install --frozen-lockfile` and the schema.d.ts drift-gate.
      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # D-72-05: exclude @clubcore/client from recursive steps — it has a
      # dedicated parallel `client` job. Running it here too would double-run
      # lint/typecheck/test across two CI jobs for every push.
      # Also exclude @clubcore/admin — it has its own dedicated parallel job.
      - name: Lint (workspaces)
        run: pnpm -r --filter '!@clubcore/client' --filter '!@clubcore/admin' lint

      - name: Typecheck (workspaces)
        run: pnpm -r --filter '!@clubcore/client' --filter '!@clubcore/admin' typecheck

      - name: Test (workspaces)
        run: pnpm -r --filter '!@clubcore/client' --filter '!@clubcore/api-client' --filter '!@clubcore/admin' test

      - name: Test @clubcore/api-client
        run: pnpm -F @clubcore/api-client test

      - name: Codegen — packages/api-client
        run: pnpm --filter @clubcore/api-client codegen

      # D-02 / API-07: any backend-schema change that did not regenerate
      # packages/api-client/src/schema.d.ts (locally + commit) fails here.
      #
      # WR-06: see comment on the backend drift gate above — assert tracked
      # before diffing so an accidental gitignore does not silently disable
      # the gate.
      - name: Drift gate — packages/api-client/src/schema.d.ts
        run: |
          git ls-files --error-unmatch packages/api-client/src/schema.d.ts
          git diff --exit-code packages/api-client/src/schema.d.ts

  # D-72-03/04 (HND-03): dedicated parallel client gate — runs typecheck,
  # lint, test, AND build alongside backend / frontend / redocly-lint (no needs:).
  # The build step is mandatory (D-72-04): `vite build` + vite-plugin-pwa
  # service-worker / manifest generation is a failure surface that
  # `tsc -b --noEmit` typecheck alone does not cover.
  client:
    name: Client PWA (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -F @clubcore/client typecheck

      - name: Lint
        run: pnpm -F @clubcore/client lint

      - name: Test
        run: pnpm -F @clubcore/client test

      - name: Build
        run: pnpm -F @clubcore/client build

  # Dedicated parallel admin gate — runs typecheck, lint, test, AND build
  # alongside backend / frontend / client / redocly-lint (no needs:).
  # Excluded from the recursive `pnpm -r` frontend steps to prevent double-running.
  admin:
    name: Admin App (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -F @clubcore/admin typecheck

      - name: Lint
        run: pnpm -F @clubcore/admin lint

      - name: Test
        run: pnpm -F @clubcore/admin test

      - name: Build
        run: pnpm -F @clubcore/admin build

  # FRZ-07 / D-64-REDOCLY-CI-PLACEMENT — 7th parallel CI gate.
  # Validates apps/backend/openapi.json against the `recommended` Redocly ruleset
  # declared in redocly.yaml at the repo root. Runs in parallel with `backend` and
  # `frontend` (no `needs:` dependency) — a spec regression fails CI before merge
  # without blocking the backend or frontend lint jobs.
  # Version: @latest — acceptable for a lint-only step (no runtime artifact).
  # Pin to an exact version (e.g. @redocly/cli@1.34.4) in a future maintenance
  # commit if byte-stable CI reproducibility becomes a requirement.
  redocly-lint:
    name: Redocly lint (openapi.json)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Redocly lint
        run: npx -y @redocly/cli@latest lint apps/backend/openapi.json
